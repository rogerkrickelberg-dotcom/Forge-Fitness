<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Block &mdash; 10 Weeks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E7E3;
  --card:#FCFCFB;
  --ink:#191F26;
  --muted:#6A737C;
  --hair:#CDD2CE;
  --strength:#383E48;
  --kb:#96602C;
  --easy:#4A7A5C;
  --quality:#BC4527;
  --long:#2E5B7A;
  --bike:#8A4F6D;
  --mobility:#5D7C86;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}

header{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:24px;flex-wrap:wrap;border-bottom:2px solid var(--ink);
  padding-bottom:14px;margin-bottom:26px;
}
.hgroup h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:52px;line-height:.92;letter-spacing:-.01em;margin:0}
.hgroup .sub{color:var(--muted);font-size:14px;margin-top:6px}
.hgroup .sub b{color:var(--ink);font-weight:600}
.setup{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.setup input{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--hair);background:var(--card);border-radius:3px;color:var(--ink)}

.cols{display:grid;grid-template-columns:1fr 320px;gap:40px;align-items:start}

.dayhead{display:flex;align-items:baseline;gap:14px;margin-bottom:4px;flex-wrap:wrap}
.dayhead h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:34px;margin:0;line-height:1}
.dayhead .focus{color:var(--muted);font-size:16px}
.daynote{color:var(--muted);font-size:14px;margin:0 0 22px;max-width:72ch}

.tl{position:relative;padding-left:76px}
.tl:before{content:'';position:absolute;left:63px;top:8px;bottom:8px;width:1px;background:var(--hair)}
.slot{position:relative;margin-bottom:14px}
.slot .clock{position:absolute;left:-76px;top:12px;width:52px;text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px}
.slot .dur{position:absolute;left:-76px;top:38px;width:52px;text-align:right;font-size:11px;color:var(--muted)}
.slot .dot{position:absolute;left:-16px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--paper)}
.block{
  background:var(--card);border:1px solid var(--hair);border-left:4px solid var(--c);
  border-radius:3px;padding:14px 16px 14px 18px;display:flex;gap:14px;align-items:flex-start;
  transition:opacity .15s ease;
}
.block .body{flex:1;min-width:0}
.block h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:23px;margin:0 0 1px;line-height:1.1}
.block .kind{font-size:12px;color:var(--c);font-weight:600;letter-spacing:.02em;margin-bottom:6px}
.block p{margin:0;font-size:14px;color:var(--muted);line-height:1.45;max-width:64ch}
.block p.fin{margin-top:7px;padding-top:7px;border-top:1px solid var(--hair);color:var(--ink);font-size:13.5px}
.block p.alt{margin-top:7px;font-size:13.5px;color:var(--bike);font-weight:500}
.block.done{opacity:.42}
.block.done h3{text-decoration:line-through;text-decoration-thickness:1.5px}
.tick{
  appearance:none;-webkit-appearance:none;flex:0 0 auto;width:24px;height:24px;margin:2px 0 0;
  border:1.5px solid var(--hair);border-radius:3px;background:var(--card);cursor:pointer;position:relative;transition:all .12s ease;
}
.tick:hover{border-color:var(--c)}
.tick:checked{background:var(--c);border-color:var(--c)}
.tick:checked:after{content:'';position:absolute;left:8px;top:3.5px;width:5px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.nowline{position:relative;height:0;margin:2px 0 16px}
.nowline:before{content:'';position:absolute;left:-13px;right:0;top:0;height:2px;background:var(--quality)}
.nowline span{position:absolute;left:-76px;top:-9px;width:52px;text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;color:var(--quality)}

.restcard{background:var(--card);border:1px dashed var(--hair);border-radius:3px;padding:26px 22px;margin-bottom:18px}
.restcard h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px;margin:0 0 6px}
.restcard p{margin:0;color:var(--muted);font-size:14px;max-width:64ch}

.rail section{margin-bottom:30px}
.rail h4{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--hair)}
.metric{margin-bottom:16px}
.metric .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.metric .num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:27px;line-height:1}
.metric .lbl{font-size:12px;color:var(--muted)}
.bar{height:5px;background:var(--hair);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .3s ease}

.week{list-style:none;margin:0;padding:0}
.week li{border-bottom:1px solid var(--hair)}
.week li:last-child{border-bottom:none}
.week button{width:100%;background:none;border:none;padding:9px 4px;cursor:pointer;display:flex;gap:11px;align-items:baseline;text-align:left;font-family:inherit;color:inherit;border-left:3px solid transparent}
.week button:hover{background:#EDEFEC}
.week button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.week li.sel button{border-left-color:var(--ink);background:#EDEFEC}
.week .d{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;width:34px;flex:0 0 34px}
.week .f{font-size:13.5px;color:var(--muted);line-height:1.35}
.week li.today .d{color:var(--quality)}

.arc{margin-top:44px;border-top:2px solid var(--ink);padding-top:18px}
.arc h4{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;margin:0 0 16px}
.weeks{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.wk{background:none;border:none;padding:0;cursor:pointer;font-family:inherit;color:inherit;text-align:left}
.wk .bars{height:78px;display:flex;align-items:flex-end;margin-bottom:7px}
.wk .fill{width:100%;background:var(--hair);border-radius:2px 2px 0 0;transition:background .15s ease}
.wk:hover .fill{background:#B6BDB8}
.wk.cur .fill{background:var(--ink)}
.wk.dl .fill{background:repeating-linear-gradient(135deg,var(--hair) 0 4px,#DCE0DC 4px 8px)}
.wk.cur.dl .fill{background:repeating-linear-gradient(135deg,var(--ink) 0 4px,#4A525C 4px 8px)}
.wk .n{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;line-height:1}
.wk .km{font-size:11.5px;color:var(--muted)}
.wk:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.arcnote{margin-top:14px;font-size:13px;color:var(--muted);max-width:74ch}

@media (max-width:900px){
  .cols{grid-template-columns:1fr;gap:32px}
  .hgroup h1{font-size:40px}
  .weeks{grid-template-columns:repeat(5,1fr);gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="hgroup">
    <h1 id="h-day">&nbsp;</h1>
    <div class="sub" id="h-sub">&nbsp;</div>
  </div>
  <div class="setup">
    <label for="start">Block starts</label>
    <input type="date" id="start">
  </div>
</header>

<div class="cols">
  <main>
    <div class="dayhead">
      <h2 id="d-name">&nbsp;</h2>
      <span class="focus" id="d-focus"></span>
    </div>
    <p class="daynote" id="d-note"></p>
    <div id="timeline"></div>
  </main>

  <aside class="rail">
    <section>
      <h4>This week</h4>
      <div class="metric">
        <div class="top"><span class="num" id="m-km">0</span><span class="lbl" id="m-km-l"></span></div>
        <div class="bar"><i id="m-km-bar" style="width:0%"></i></div>
      </div>
      <div class="metric">
        <div class="top"><span class="num" id="m-s">0</span><span class="lbl" id="m-s-l"></span></div>
        <div class="bar"><i id="m-s-bar" style="width:0%"></i></div>
      </div>
    </section>
    <section>
      <h4>Week at a glance</h4>
      <ul class="week" id="weeklist"></ul>
    </section>
  </aside>
</div>

<div class="arc">
  <h4>Ten-week arc</h4>
  <div class="weeks" id="arc"></div>
  <p class="arcnote" id="arcnote"></p>
</div>

</div>
<script>
/* ============================ PROGRAMME ============================ */

var PROGRAM = [
{n:1, phase:"Build 1", deload:false, km:27, easyA:5, easyB:4, longKm:10, qKm:8,
 qTitle:"Tempo: 2 x 8 min",
 qNote:"15 min easy to open. Then 2 x 8 min at comfortably hard - you can get three or four words out, not a sentence. 3 min jog between. 10 min easy home.",
 sNote:"Baseline week. 3 x 10 at RPE 7. Write down every load; the whole block is built off these numbers.",
 kbNote:"Baseline. Two rounds of a five-move complex, 30 min hard stop.",
 longNote:"Ten kilometres from a standing start. Run it far slower than you think you should - fully conversational the whole way, walk breaks allowed."},

{n:2, phase:"Build 1", deload:false, km:30, easyA:6, easyB:5, longKm:11, qKm:8,
 qTitle:"Intervals: 6 x 400 m",
 qNote:"15 min easy. 6 x 400 m at 5k effort, 90 s walk or jog between. The first rep should feel too easy. The last one should not. 10 min easy.",
 sNote:"3 x 10. Add 2.5 kg or one clean rep per lift versus last week.",
 kbNote:"Same complex as Week 1, one round more or 30 s less rest. Still 30 min.",
 longNote:"One kilometre longer. Same easy effort - the distance does the work, not the pace."},

{n:3, phase:"Build 1", deload:false, km:32, easyA:6, easyB:5, longKm:12, qKm:9,
 qTitle:"Tempo: 2 x 10 min",
 qNote:"15 min easy. 2 x 10 min at tempo, 3 min jog float between. 10 min easy.",
 sNote:"3 x 8-10 at RPE 8. Last set should finish within two reps of failure.",
 kbNote:"Heavier bell, fewer reps per move. Density over volume.",
 longNote:"Past 80 minutes now. Carry water and take something with you to eat - start practising fuelling on the move."},

{n:4, phase:"Build 1", deload:false, km:34, easyA:7, easyB:5, longKm:13, qKm:9,
 qTitle:"Intervals: 5 x 800 m",
 qNote:"15 min easy. 5 x 800 m at 5k effort, 2 min jog between. Even splits beat a hero first rep. 10 min easy.",
 sNote:"Peak of Block 1. 4 x 8 at RPE 8. Leave nothing on the main lifts, then hand the week over to the deload.",
 kbNote:"Hardest kettlebell week of Block 1. Minimal rest, 30 min, then stop.",
 longNote:"Longest of Block 1. Start slower than feels right and negative split it if anything is left."},

{n:5, phase:"Deload", deload:true, km:25, easyA:5, easyB:4, longKm:10, qKm:6,
 qTitle:"Fartlek: 8 x 1 min",
 qNote:"15 min easy. 8 x 1 min brisk with 2 min easy, run entirely by feel - no watch checks. 10 min easy.",
 sNote:"Deload. 2 x 8 at roughly 60 percent of last week's loads. Move fast and clean and stop while it still feels easy.",
 kbNote:"Light bell, technique only. Half the usual rounds, long rests.",
 longNote:"Back to ten and genuinely easy. This week is what makes Block 2 possible."},

{n:6, phase:"Build 2", deload:false, km:35, easyA:7, easyB:5, longKm:14, qKm:9,
 qTitle:"Intervals: 6 x 800 m",
 qNote:"15 min easy. 6 x 800 m at 5k effort, 2 min jog. One more rep than Week 4 at the same effort. 10 min easy.",
 sNote:"Block 2 opens. 4 x 6 at RPE 7-8, heavier than Block 1. Add one explosive opener before each main lift: jumps, a med ball throw, or hard swings.",
 kbNote:"New complex for Block 2, heavier bell. Build it this week and keep it four weeks.",
 longNote:"New territory. Two hours is not far off - eat properly beforehand and take fuel with you."},

{n:7, phase:"Build 2", deload:false, km:36, easyA:7, easyB:5, longKm:15, qKm:9,
 qTitle:"Tempo: 2 x 12 min",
 qNote:"15 min easy. 2 x 12 min at tempo, 3 min float. 10 min easy. A controlled session on purpose - the barbell is the hard part of this week.",
 sNote:"Heaviest strength week of the programme. 4 x 5 at RPE 8-9. Warm up properly, do not rush the sets, and expect the running to feel heavy all week.",
 kbNote:"Same complex, add a round or drop the rest. 30 min.",
 longNote:"Fifteen kilometres on legs that lifted heavy this week. Slow it down and treat it as time on feet."},

{n:8, phase:"Build 2", deload:false, km:40, easyA:8, easyB:5, longKm:17, qKm:10,
 qTitle:"Intervals: 3 x 1600 m",
 qNote:"15 min easy. 3 x 1600 m at 10k effort - controlled, not 5k pace - with 3 min jog between. Longest reps of the block. 10 min easy.",
 sNote:"4 x 5 at RPE 8. Hold Week 7's loads rather than chasing more; the running takes over from here.",
 kbNote:"Heaviest bell you can keep clean form with. Fewer reps, full intent.",
 longNote:"First 17. Fuel every 45 min, start conservatively, and do not be a hero in the last 3 km."},

{n:9, phase:"Build 2", deload:false, km:40, easyA:8, easyB:5, longKm:18, qKm:9,
 qTitle:"Intervals: 5 x 1000 m",
 qNote:"15 min easy. 5 x 1000 m at 10k effort, 90 s jog. After the mile repeats these should feel short. 10 min easy.",
 sNote:"Strength drops back to maintenance: 3 x 5 at roughly 90 percent of Week 7. Do not add weight. This week belongs to the long run.",
 kbNote:"Hold Week 8's bell. Cleanest, fastest version of the complex you have done.",
 longNote:"Peak long run - 18 km, around two hours. Biggest single session of the block. Fuel, hydrate, and go out slow."},

{n:10, phase:"Test", deload:true, km:27, easyA:5, easyB:4, longKm:10, qKm:8,
 qTitle:"5 km time trial",
 qNote:"20 min easy with four short strides. Then 5 km hard and evenly paced. 10 min easy. This number is your block result.",
 sNote:"Test week. Warm up, then one top set to technical failure per main lift. Record the reps and put them next to Week 1.",
 kbNote:"Light and short. The time trial is the priority this week.",
 longNote:"Back to ten, easy. Recovery from the time trial, nothing more."}
];

var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var SHORT=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var FOCUS=["Legs + easy run","Push + mobility","Quality run + kettlebell","Legs + easy run",
           "Pull + mobility","Long run + kettlebell flow","Rest"];

var MOB_N="Hips, ankles, thoracic spine. Deep squat hold, couch stretch, ankle rocks, 90/90 transitions.";
var BIKE_ALT="Swap for 30 min easy on the stationary bike if your legs are flat or anything is nagging. Same aerobic value, none of the impact.";

function mins(t){var p=t.split(":");return +p[0]*60+ +p[1];}
function hhmm(m){m=Math.round(m);var h=Math.floor(m/60)%24,x=m%60;return (h<10?"0":"")+h+":"+(x<10?"0":"")+x;}
function dur(m){var h=Math.floor(m/60),x=m%60;return h?(h+"h"+(x?" "+x+"m":"")):(x+" min");}

function buildDay(w,d){
  var s=[], easyPace=6.5, longPace=6.8;

  if(d===0){
    s.push({t:"08:15",m:55,kind:"Legs",c:"strength",title:"Lower-body strength",note:w.sNote,
            fin:"Core finisher, 8 min: loaded carries and hanging leg raises."});
    s.push({t:"17:30",m:Math.round(w.easyA*easyPace),kind:"Easy run",c:"easy",
            title:"Easy run "+w.easyA+" km",km:w.easyA,
            note:"Deliberately run on legs that already worked this morning. Slowest run of the week - do not race it.",
            alt:BIKE_ALT});
  }
  if(d===1){
    s.push({t:"08:15",m:45,kind:"Push",c:"strength",title:"Push strength",note:w.sNote,
            fin:"Core finisher, 8 min: anti-extension work - hollow holds, ab wheel, dead bugs."});
    s.push({t:"20:15",m:20,kind:"Mobility",c:"mobility",title:"Mobility",note:MOB_N});
  }
  if(d===2){
    s.push({t:"08:00",m:60,kind:"Quality run",c:"quality",title:w.qTitle+"  ~"+w.qKm+" km",km:w.qKm,note:w.qNote});
    s.push({t:"18:00",m:30,kind:"Kettlebell",c:"kb",title:"Kettlebell, upper-body focus",
            note:"Presses, rows, cleans, high pulls, carries. Deliberately keeps the legs out of it - they ran hard this morning. "+w.kbNote,
            fin:"Core finisher, 5 min: hard plank series or a heavy carry."});
  }
  if(d===3){
    s.push({t:"08:15",m:55,kind:"Legs",c:"strength",title:"Lower-body strength",
            note:w.sNote+" Second legs day: bias unilateral and posterior chain rather than repeating Monday.",
            fin:"Core finisher, 8 min: loaded carries and hanging leg raises."});
    s.push({t:"17:30",m:Math.round(w.easyB*easyPace),kind:"Easy run",c:"easy",
            title:"Easy run "+w.easyB+" km",km:w.easyB,
            note:"Short and relaxed on legs that already worked this morning. The most expendable session in the week - cut it first if you are run down.",
            alt:BIKE_ALT});
  }
  if(d===4){
    s.push({t:"08:15",m:45,kind:"Pull",c:"strength",title:"Pull strength",note:w.sNote,
            fin:"Core finisher, 8 min: anti-rotation work - Pallof press, side plank, suitcase carry."});
    s.push({t:"20:15",m:20,kind:"Mobility",c:"mobility",title:"Mobility",note:MOB_N});
  }
  if(d===5){
    s.push({t:"09:30",m:Math.round(w.longKm*longPace),kind:"Long run",c:"long",
            title:"Long run "+w.longKm+" km",km:w.longKm,note:w.longNote});
    s.push({t:"17:00",m:30,kind:"Kettlebell",c:"kb",title:"Kettlebell flow",
            note:"Light bell, full body, low intensity. Turkish get-ups, halos, windmills, slow flowing complexes. Recovery work, not a session to chase."});
  }
  if(d===6){
    s.push({t:"10:30",m:35,kind:"Optional",c:"bike",title:"Easy spin",
            note:"Optional. 35 min on the stationary bike, easy enough to hold a conversation. Strongly recommended in Weeks 8 and 9, when the long run is at its biggest. Flushes the legs without adding impact. Skip it if you would rather do nothing."});
  }
  return s;
}

/* ============================ STATE ============================ */

var KEY="trainingBlock.v4";
var state={start:null,done:{}};
try{var raw=localStorage.getItem(KEY); if(raw) state=JSON.parse(raw);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function nextMonday(){
  var d=new Date(); d.setHours(0,0,0,0);
  var off=(8-d.getDay())%7; if(off===0) off=7;
  if(d.getDay()===1) off=0;
  d.setDate(d.getDate()+off); return d;
}
if(!state.start) state.start=iso(nextMonday());

var view={w:0,d:0};
function startDate(){var p=state.start.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function todayPos(){
  var t=new Date(); t.setHours(0,0,0,0);
  var diff=Math.floor((t-startDate())/86400000);
  if(diff<0||diff>69) return null;
  return {w:Math.floor(diff/7), d:diff%7};
}
function dateOf(w,d){var x=startDate(); x.setDate(x.getDate()+w*7+d); return x;}

/* ============================ RENDER ============================ */

function render(){
  var w=PROGRAM[view.w], sessions=buildDay(w,view.d);
  var tp=todayPos(), isToday = tp && tp.w===view.w && tp.d===view.d;
  var dt=dateOf(view.w,view.d);

  document.getElementById("h-day").textContent =
    DAYS[view.d]+" "+dt.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][dt.getMonth()];
  document.getElementById("h-sub").innerHTML =
    "Week <b>"+w.n+"</b> of 10 &nbsp;/&nbsp; "+w.phase+" &nbsp;/&nbsp; <b>"+w.km+" km</b> of running planned"+
    (isToday?"":" &nbsp;/&nbsp; not today");

  document.getElementById("d-name").textContent=FOCUS[view.d];
  document.getElementById("d-focus").textContent = view.d===6 ? "" : sessions.length+" sessions";
  document.getElementById("d-note").textContent=dayNote(view.d);

  var tl=document.getElementById("timeline"); tl.innerHTML="";

  if(view.d===6){
    var rc=document.createElement("div"); rc.className="restcard";
    rc.innerHTML='<h3>Nothing required</h3><p>Full rest day. You ran long yesterday and start again with heavy legs tomorrow, so this is the gap that makes both of those work. Eat well and sleep.</p>';
    tl.appendChild(rc);
  }

  var host=document.createElement("div"); host.className="tl";
  var now=new Date(), nowM=now.getHours()*60+now.getMinutes(), placed=false;
  sessions.forEach(function(s,i){
    if(isToday && !placed && nowM < mins(s.t)){
      var nl=document.createElement("div"); nl.className="nowline";
      nl.innerHTML='<span>'+hhmm(nowM)+'</span>'; host.appendChild(nl); placed=true;
    }
    host.appendChild(slot(s,i));
  });
  if(isToday && !placed){
    var nl2=document.createElement("div"); nl2.className="nowline";
    nl2.innerHTML='<span>'+hhmm(nowM)+'</span>'; host.appendChild(nl2);
  }
  tl.appendChild(host);

  renderRail(w); renderWeekList(tp); renderArc();
}

function dayNote(d){
  if(d===0) return "Wake 07:30. Heaviest leg session of the week goes first, while you are fresh. The run afterwards is meant to feel heavy.";
  if(d===1) return "Wake 07:30. Upper body push, no running. A full recovery day for the legs before Wednesday.";
  if(d===2) return "Wake 07:30. The one run of the week that is meant to hurt. Eat something small first. The bell later stays above the waist because your legs already worked.";
  if(d===3) return "Wake 07:30. Second legs session, angled differently from Monday, then the shortest run of the week.";
  if(d===4) return "Wake 07:30. Pull day and nothing else. This is the buffer that protects tomorrow's long run - keep it that way.";
  if(d===5) return "Later start. Long run mid-morning, light bell in the afternoon to loosen off.";
  return "No alarm needed.";
}

function slot(s,i){
  var k=view.w+"-"+view.d+"-"+i;
  var el=document.createElement("div");
  el.className="slot"; el.style.setProperty("--c","var(--"+s.c+")");
  var checked=!!state.done[k];
  el.innerHTML=
    '<span class="clock">'+s.t+'</span>'+
    '<span class="dur">'+dur(s.m)+'</span>'+
    '<span class="dot"></span>'+
    '<div class="block'+(checked?" done":"")+'">'+
      '<input type="checkbox" class="tick"'+(checked?" checked":"")+'>'+
      '<div class="body"><div class="kind"></div><h3></h3><p class="main"></p></div>'+
    '</div>';
  el.querySelector(".kind").textContent=s.kind;
  el.querySelector("h3").textContent=s.title;
  el.querySelector("p.main").textContent=s.note;
  var body=el.querySelector(".body");
  if(s.alt){var a=document.createElement("p"); a.className="alt"; a.textContent=s.alt; body.appendChild(a);}
  if(s.fin){var f=document.createElement("p"); f.className="fin"; f.textContent=s.fin; body.appendChild(f);}
  var cb=el.querySelector(".tick");
  cb.setAttribute("aria-label","Mark "+s.title+" complete");
  cb.addEventListener("change",function(){
    if(cb.checked) state.done[k]=1; else delete state.done[k];
    save();
    el.querySelector(".block").classList.toggle("done",cb.checked);
    renderRail(PROGRAM[view.w]);
  });
  return el;
}

function weekTally(wi){
  var w=PROGRAM[wi], kmDone=0, sDone=0, sTotal=0;
  for(var d=0;d<7;d++){
    if(d===6) continue;
    var ss=buildDay(w,d);
    for(var i=0;i<ss.length;i++){
      sTotal++;
      if(state.done[wi+"-"+d+"-"+i]){ sDone++; if(ss[i].km) kmDone+=ss[i].km; }
    }
  }
  return {kmDone:kmDone,sDone:sDone,sTotal:sTotal};
}

function renderRail(w){
  var t=weekTally(view.w);
  document.getElementById("m-km").textContent=t.kmDone;
  document.getElementById("m-km-l").textContent="of "+w.km+" km run";
  document.getElementById("m-km-bar").style.width=Math.min(100,t.kmDone/w.km*100)+"%";
  document.getElementById("m-s").textContent=t.sDone;
  document.getElementById("m-s-l").textContent="of "+t.sTotal+" sessions ticked";
  document.getElementById("m-s-bar").style.width=(t.sDone/t.sTotal*100)+"%";
}

function renderWeekList(tp){
  var ul=document.getElementById("weeklist"); ul.innerHTML="";
  for(var d=0;d<7;d++){
    (function(d){
      var li=document.createElement("li"); var cls="";
      if(d===view.d) cls="sel";
      if(tp && tp.w===view.w && tp.d===d) cls+=" today";
      li.className=cls;
      var b=document.createElement("button");
      b.innerHTML='<span class="d"></span><span class="f"></span>';
      b.querySelector(".d").textContent=SHORT[d];
      b.querySelector(".f").textContent=FOCUS[d];
      b.addEventListener("click",function(){view.d=d;render();});
      li.appendChild(b); ul.appendChild(li);
    })(d);
  }
}

function renderArc(){
  var arc=document.getElementById("arc"); arc.innerHTML="";
  var max=40;
  PROGRAM.forEach(function(w,i){
    var b=document.createElement("button");
    b.className="wk"+(i===view.w?" cur":"")+(w.deload?" dl":"");
    b.innerHTML='<span class="bars"><span class="fill"></span></span><span class="n"></span><br><span class="km"></span>';
    b.querySelector(".fill").style.height=Math.round(w.km/max*78)+"px";
    b.querySelector(".n").textContent="W"+w.n;
    b.querySelector(".km").textContent=w.km+" km";
    b.title="Week "+w.n+" - "+w.phase+" - "+w.qTitle;
    b.addEventListener("click",function(){view.w=i;render();});
    arc.appendChild(b);
  });
  var w=PROGRAM[view.w];
  document.getElementById("arcnote").textContent=
    "Week "+w.n+" quality session: "+w.qTitle+". Hatched bars are deload weeks - Week 5 pulls everything back so Block 2 can go heavier, and Week 10 tapers into the 5 km test.";
}

/* ============================ BOOT ============================ */

var si=document.getElementById("start");
si.value=state.start;
si.addEventListener("change",function(){
  if(!si.value) return;
  state.start=si.value; save();
  var tp=todayPos(); view = tp ? {w:tp.w,d:tp.d} : {w:0,d:0};
  render();
});
var tp0=todayPos();
view = tp0 ? {w:tp0.w,d:tp0.d} : {w:0,d:0};
render();
</script>
</body>
